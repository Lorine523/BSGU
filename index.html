<script>
// ─── SUPABASE SHARED STORAGE (real-time shared data across all coaches) ────
const SUPABASE_URL = "https://udhcbxivwxukjbjdshew.supabase.co";
const SUPABASE_KEY = "sb_publishable_yv-u72GsC72uInJUJlvfUQ_e9n38LP6";
const ROW_ID = "bsgu";

window.storage = {
  async get(key) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/club_data?id=eq.${ROW_ID}&select=data`, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
        },
      });
      if (!res.ok) {
        console.error("Supabase HTTP error", res.status, await res.text());
        return null;
      }
      const rows = await res.json();
      if (!Array.isArray(rows) || !rows[0] || !rows[0].data) return null;
      const val = rows[0].data;
      if (val && Object.keys(val).length === 0) return null;
      return { value: JSON.stringify(val) };
    } catch (e) {
      console.error("Supabase get error", e);
      return null;
    }
  },
  async set(key, value) {
    try {
      const parsed = JSON.parse(value);
      const res = await fetch(`${SUPABASE_URL}/rest/v1/club_data?id=eq.${ROW_ID}`, {
        method: "PATCH",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal",
        },
        body: JSON.stringify({ data: parsed, updated_at: new Date().toISOString() }),
      });
      if (!res.ok) {
        console.error("Supabase set HTTP error", res.status, await res.text());
        throw new Error("Supabase set failed: " + res.status);
      }
      return { value };
    } catch (e) {
      console.error("Supabase set error", e);
      throw e;
    }
  },
};
</script>

<script>

  }
});
